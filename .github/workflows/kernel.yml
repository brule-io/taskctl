name: Bounded kernel conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_PASSWORD: kernel-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise the disposable PostgreSQL and loopback HTTP adapters
        env:
          TASKCTL_KERNEL_DISPOSABLE: '1'
          TASKCTL_KERNEL_JDBC_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
          TASKCTL_KERNEL_USER: postgres
          TASKCTL_KERNEL_PASSWORD: kernel-test-only
        run: python scripts/kernel_test.py --existing-disposable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-proof
          path: |
            build/proof/kernel*.json
            kernel/build/test-results/**/*.xml
            kernel/build/libs/*.jar
