name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check candidate specification source and evidence links
        run: python scripts/check_candidate_spec.py
      - name: Check source
        shell: bash
        run: ./gradlew --no-daemon check :cli:installDist
      - name: Acquire digest-pinned GraalVM build toolchain
        run: python scripts/graalvm.py
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Compile native tool and run the existing behavioral corpus natively
        shell: bash
        run: ./gradlew --no-daemon :cli:nativeCompile :native-tests:nativeTest --max-workers=1
      - name: Require identical successful JVM and native test identities
        run: python scripts/corpus_proof.py
      - name: Package both standalone implementations
        run: |
          python scripts/package.py --kind jvm
          python scripts/package.py --kind native
      - name: Verify reproducible archive bytes
        run: |
          python scripts/reproducibility_test.py --kind jvm
          python scripts/reproducibility_test.py --kind native
      - name: Prove pinned acquisition without build tools
        run: |
          python scripts/bootstrap_test.py --kind jvm
          python scripts/bootstrap_test.py --kind native
      - name: Compare process outputs exit codes and repository effects
        run: python scripts/parity_test.py
      - name: Inspect the actual self-host graph without mutations
        run: |
          python scripts/selfhost_test.py --kind native
          python scripts/selfhost_test.py --kind jvm
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: |
            build/distributions/*
            build/proof/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/test-results/test/*.xml
            **/build/test-results/test-native/*.xml
