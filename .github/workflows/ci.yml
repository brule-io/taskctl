name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source
        shell: bash
        run: ./gradlew --no-daemon check :cli:installDist
      - name: Package standalone runtime
        run: python scripts/package.py
      - name: Verify reproducible archive bytes
        run: python scripts/reproducibility_test.py
      - name: Prove pinned acquisition without build tools
        run: python scripts/bootstrap_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: |
            build/distributions/*
            build/proof/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'
